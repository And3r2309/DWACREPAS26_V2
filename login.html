<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CrepasVibes - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body data-pagina="login">
    <div id="nav"></div>
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <h2 class="titulo">Iniciar sesión</h2>
                    <form id="formLogin">
                        <label for="correo">Correo electrónico</label>
                        <input id="correo" type="email" class="form-control mb-3" required>
                        <label for="clave">Contraseña</label>
                        <input id="clave" type="password" class="form-control mb-3" required>
                        <button class="btn btn-crepa w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer>CrepasVibes - Diseño Web Adaptable - ITCA-FEPADE</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/app.js"></script>
</body>

</html>
